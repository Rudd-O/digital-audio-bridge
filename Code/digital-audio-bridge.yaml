# Succesfully built with ESPHome 2026.6.4,
#
# To build the firmware, run:
#
# ```sh
# esphome compile path/to/digital-audio-bridge.yaml
# ```
#
# then take the `firmware.factory.bin` under the
# `.esphome/build/digital-audio-bridge/.pioenvs/digital-audio-bridge`
# folder, and flash that to factory-reset and prep the device for use.
# Do not flash that image via OTA — only via serial.

substitutions:
  name: digital-audio-bridge
  friendly_name: Digital audio bridge
  # Change this if most of your audio sources are 48 KHz (rare).
  sample_rate: 44100
  speaker_timeout: 1000ms
  keep_alive: false
  task_stack_in_psram: false
  codec_support: false
  format: WAV

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.11.0
  project:
    name: "Rudd-O.Digital audio bridge"
    version: "0.5.0"
  on_boot:
    priority: 210
    then:
      - delay: 2s
      # Run the script to refresh the LED status
      - script.execute: control_leds

dashboard_import:
  package_import_url: github://Rudd-O/digital-audio-bridge/Code/digital-audio-bridge.yaml

globals:
  - id: disconnected_from_wifi
    type: bool
    restore_value: no

script:
  - id: control_leds
    then:
    - if:
        condition: wifi.ap_active
        then:
          - light.turn_on:
              id: indicator_light
              effect: Access point active
        else:
          - logger.log: Not AP active
          - if:
              condition: wifi.connected
              then:
                - logger.log: Wi-Fi connected
                - light.turn_off:
                    id: indicator_light
                - light.turn_on:
                    id: indicator_light
                    brightness: 100%
                    red: 0.0
                    green: 0.0
                    blue: 1.0
                    flash_length: 5s
                - delay: 5s
                - light.turn_off:
                    id: indicator_light
              else:
                - if:
                    condition:
                      - lambda: return id(disconnected_from_wifi);
                    then:
                      - logger.log: Not connected to Wi-Fi
                      - light.turn_on:
                          id: indicator_light
                          effect: Not connected to Wi-Fi
                    else:
                      - logger.log: Scanning for Wi-Fi
                      - light.turn_on:
                          id: indicator_light
                          effect: Scanning for Wi-Fi

esp32:
  # Ju Jiasheng ESP32-S3-N16R8 from AliExpress.
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

logger:
  level: debug # FIXME in prod make info

http_request:

# Enable Home Assistant API.
api:
  encryption: {}
  # You may not want to connect Home Assistant to this device.
  # You may just want to use it as a Music Assistant one.
  # So by default we set this to zero (disabled).
  reboot_timeout: 0s

update:
  - platform: http_request
    name: None
    id: update_http_request
    source: https://rudd-o.com/downloads/esphome/digital-audio-bridge/manifest.json

ota:
  - platform: http_request
    id: ota_http_request
# The ESPHome OTA component is not enabled by default.
# The device can thus be flashed via serial.
# If you want to flash over ESPHome, turn on the platform and set
# a password below, rebuild, then reflash via serial once more.
#   - platform: esphome
#     password: "fc6da18a797824283748596027f304e6"

psram:
  ignore_not_found: false
  mode: octal

network:
  enable_high_performance: true

wifi:
  use_psram: true
  ap: {}
  on_connect: 
    then:
      - globals.set:
          id: disconnected_from_wifi
          value: "false"
      - script.execute: control_leds
  on_disconnect: 
    then:
      - globals.set:
          id: disconnected_from_wifi
          value: "true"
      - script.execute: control_leds

improv_serial:

captive_portal:

light:
  - platform: esp32_rmt_led_strip
    channel_colors: GRB
    color_correct: [90%, 75%, 65%]
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    name: "Indicator light"
    id: indicator_light
    disabled_by_default: true
    effects:
      - strobe:
          name: Access point active
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 100%
              blue: 0%
              duration: 500ms
              transition_length: 400ms
            - state: false
              duration: 500ms
              transition_length: 400ms
      - strobe:
          name: Not connected to Wi-Fi
          colors:
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 500ms
              transition_length: 400ms
            - state: false
              duration: 500ms
              transition_length: 400ms
      - strobe:
          name: Scanning for Wi-Fi
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 50%
              blue: 90%
              duration: 500ms
              transition_length: 400ms
            - state: false
              duration: 500ms
              transition_length: 400ms

button:
- platform: restart
  name: Restart
  entity_category: diagnostic
  icon: mdi:restart
- platform: factory_reset
  name: "Restart with factory default settings"
  id: reset
  disabled_by_default: true
  entity_category: config

sensor:
  - platform: internal_temperature
    name: "Device temperature"
    update_interval: 10s
    entity_category: diagnostic
    disabled_by_default: true
  - platform: wifi_signal
    name: "Wi-Fi signal strength"
    update_interval: 10s
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: track_progress
    name: Track progress
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: track_duration
    name: Track duration
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: track
    name: Track number
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: year
    name: Track year
    entity_category: diagnostic
    disabled_by_default: true

text_sensor:
  - platform: sendspin
    type: title
    name: Track title
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: artist
    name: Track artist
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: album
    name: Track album
    entity_category: diagnostic
    disabled_by_default: true
  - platform: sendspin
    type: album_artist
    name: Album artist
    entity_category: diagnostic
    disabled_by_default: true

i2s_audio:
  - id: i2s_bus

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: ${sample_rate}
    i2s_dout_pin: GPIO47
    spdif_mode: true
    bits_per_sample: 16bit
    i2s_audio_id: i2s_bus
    dac_type: external
    channel: stereo
    timeout: ${speaker_timeout}
    keep_alive: ${keep_alive}
    use_apll: true

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 2
    task_stack_in_psram: ${task_stack_in_psram}
    source_speakers:
      - id: announcement_mixing_input
      - id: media_mixing_input

  # Virtual speakers to resample each pipeline's audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: ${sample_rate}
    task_stack_in_psram: ${task_stack_in_psram}
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: ${sample_rate}
    task_stack_in_psram: ${task_stack_in_psram}

##### Sendspin Configuration
sendspin:
  id: sendspin_hub
  task_stack_in_psram: ${task_stack_in_psram}

media_source:
  - platform: sendspin
    id: sendspin_source
    static_delay_adjustable: true

media_player:
  - platform: speaker_source
    id: external_media_player
    name: None
    media_pipeline:
      speaker: media_resampling_speaker
      sources:
        - sendspin_source
      format: ${format}
      num_channels: 2
      sample_rate: ${sample_rate}
  - platform: sendspin
    id: sendspin_group_media_player
